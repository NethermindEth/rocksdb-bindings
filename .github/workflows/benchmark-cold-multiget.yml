name: Benchmark cold MultiGet

# Steady-state partial-miss read benchmark (benchmarks/ColdMultiGet). Runs the repository's
# native library as the control and, when a build-rocksdb run id is given, that run's Linux
# library as the candidate: once with io_uring on and once with ROCKSDB_NET_IO_URING=0.
# Also packs the candidate into a NuGet package artifact for a local-feed validation in
# Nethermind. Nothing is published.

on:
  # workflow_dispatch only resolves on the default branch, so a push to the benchmark branch runs
  # with the values in benchmarks/ColdMultiGet/ci-params.json; dispatch inputs override them.
  push:
    branches: [perf/cold-multiget-bench]
    paths:
      - benchmarks/**
      - src/**
      - native/**
      - .github/workflows/benchmark-cold-multiget.yml
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: build-rocksdb.yml run id whose linux-x64/linux-arm64 artifacts are the candidate library (empty = control only)
        required: false
        default: ""
      size_gb:
        description: Database size in GB (must exceed the cache several times over)
        required: false
        default: "4"
      cache_mb:
        description: Block cache size in MB
        required: false
        default: "256"
      rounds:
        description: ABBA rounds
        required: false
        default: "6"
      batches:
        description: Timed batches per arm per round
        required: false
        default: "150"
      threads:
        description: Threads for the scalarN arm
        required: false
        default: "8"
      hot_share:
        description: Share of each batch taken from the warmed hot set
        required: false
        default: "0.3"
      read_io_threads:
        description: Extra runs with this many RocksDB async read executor threads (0 = skip)
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  bench:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      DB_PATH: ${{ github.workspace }}/cold-db
      RESULTS: ${{ github.workspace }}/results
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Resolve parameters
        env:
          IN_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          IN_SIZE_GB: ${{ inputs.size_gb }}
          IN_CACHE_MB: ${{ inputs.cache_mb }}
          IN_ROUNDS: ${{ inputs.rounds }}
          IN_BATCHES: ${{ inputs.batches }}
          IN_THREADS: ${{ inputs.threads }}
          IN_HOT_SHARE: ${{ inputs.hot_share }}
          IN_READ_IO_THREADS: ${{ inputs.read_io_threads }}
        run: |
          params=benchmarks/ColdMultiGet/ci-params.json
          resolve() { # name input-value
            value="$2"
            # The file keys are the lower-case input names.
            if [ -z "$value" ]; then value=$(jq -r --arg k "$(echo "$1" | tr '[:upper:]' '[:lower:]')" '.[$k] // ""' "$params"); fi
            echo "$1=$value" >> "$GITHUB_ENV"
            echo "$1=$value"
          }
          resolve CANDIDATE_RUN_ID "$IN_CANDIDATE_RUN_ID"
          resolve SIZE_GB "$IN_SIZE_GB"
          resolve CACHE_MB "$IN_CACHE_MB"
          resolve ROUNDS "$IN_ROUNDS"
          resolve BATCHES "$IN_BATCHES"
          resolve THREADS "$IN_THREADS"
          resolve HOT_SHARE "$IN_HOT_SHARE"
          resolve READ_IO_THREADS "$IN_READ_IO_THREADS"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Build benchmark
        run: dotnet build benchmarks/ColdMultiGet -c release

      - name: Locate the native library in the build output
        id: native
        run: |
          lib=$(find benchmarks/artifacts/bin -path "*runtimes/linux-${{ matrix.arch }}/native/librocksdb.so" | head -1)
          if [ -z "$lib" ]; then echo "::error::native library not found in build output"; exit 1; fi
          echo "lib=$lib" >> "$GITHUB_OUTPUT"
          cp "$lib" "$RUNNER_TEMP/control-librocksdb.so"
          sha256sum "$lib"

      - name: Build database
        run: |
          mkdir -p "$RESULTS"
          app=$(find benchmarks/artifacts/bin -name ColdMultiGet.dll | head -1)
          dotnet "$app" --mode build --db "$DB_PATH" --size-gb "$SIZE_GB"
          df -h "$DB_PATH"

      - name: Run control (repository library)
        run: |
          app=$(find benchmarks/artifacts/bin -name ColdMultiGet.dll | head -1)
          dotnet "$app" --mode run --db "$DB_PATH" --size-gb "$SIZE_GB" --cache-mb "$CACHE_MB" \
            --rounds "$ROUNDS" --batches "$BATCHES" --threads "$THREADS" --hot-share "$HOT_SHARE" \
            --label control-${{ matrix.arch }} --out "$RESULTS/control-${{ matrix.arch }}.json" | tee "$RESULTS/control-${{ matrix.arch }}.log"

      - name: Download candidate library
        if: env.CANDIDATE_RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$CANDIDATE_RUN_ID" -R "$GITHUB_REPOSITORY" -n "linux-${{ matrix.arch }}" --dir "$RUNNER_TEMP/candidate"
          sha256sum "$RUNNER_TEMP/candidate/librocksdb.so"
          cp "$RUNNER_TEMP/candidate/librocksdb.so" "${{ steps.native.outputs.lib }}"

      - name: Run candidate (io_uring on)
        if: env.CANDIDATE_RUN_ID != ''
        run: |
          app=$(find benchmarks/artifacts/bin -name ColdMultiGet.dll | head -1)
          dotnet "$app" --mode run --db "$DB_PATH" --size-gb "$SIZE_GB" --cache-mb "$CACHE_MB" \
            --rounds "$ROUNDS" --batches "$BATCHES" --threads "$THREADS" --hot-share "$HOT_SHARE" \
            --label candidate-${{ matrix.arch }} --out "$RESULTS/candidate-${{ matrix.arch }}.json" | tee "$RESULTS/candidate-${{ matrix.arch }}.log"

      - name: Run candidate (ROCKSDB_NET_IO_URING=0)
        if: env.CANDIDATE_RUN_ID != ''
        env:
          ROCKSDB_NET_IO_URING: "0"
        run: |
          app=$(find benchmarks/artifacts/bin -name ColdMultiGet.dll | head -1)
          dotnet "$app" --mode run --db "$DB_PATH" --size-gb "$SIZE_GB" --cache-mb "$CACHE_MB" \
            --rounds "$ROUNDS" --batches "$BATCHES" --threads "$THREADS" --hot-share "$HOT_SHARE" \
            --label candidate-nouring-${{ matrix.arch }} --out "$RESULTS/candidate-nouring-${{ matrix.arch }}.json" | tee "$RESULTS/candidate-nouring-${{ matrix.arch }}.log"

      - name: Run candidate with more read executor threads
        if: env.CANDIDATE_RUN_ID != '' && env.READ_IO_THREADS != '' && env.READ_IO_THREADS != '0'
        run: |
          app=$(find benchmarks/artifacts/bin -name ColdMultiGet.dll | head -1)
          dotnet "$app" --mode run --db "$DB_PATH" --size-gb "$SIZE_GB" --cache-mb "$CACHE_MB" \
            --rounds "$ROUNDS" --batches "$BATCHES" --threads "$THREADS" --hot-share "$HOT_SHARE" --read-io-threads "$READ_IO_THREADS" \
            --label candidate-io$READ_IO_THREADS-${{ matrix.arch }} --out "$RESULTS/candidate-io$READ_IO_THREADS-${{ matrix.arch }}.json" | tee "$RESULTS/candidate-io$READ_IO_THREADS-${{ matrix.arch }}.log"

      - name: Run control again (repository library, drift check)
        run: |
          cp "$RUNNER_TEMP/control-librocksdb.so" "${{ steps.native.outputs.lib }}"
          app=$(find benchmarks/artifacts/bin -name ColdMultiGet.dll | head -1)
          dotnet "$app" --mode run --db "$DB_PATH" --size-gb "$SIZE_GB" --cache-mb "$CACHE_MB" \
            --rounds "$ROUNDS" --batches "$BATCHES" --threads "$THREADS" --hot-share "$HOT_SHARE" \
            --label control2-${{ matrix.arch }} --out "$RESULTS/control2-${{ matrix.arch }}.json" | tee "$RESULTS/control2-${{ matrix.arch }}.log"

      - name: Run control with more read executor threads
        if: env.READ_IO_THREADS != '' && env.READ_IO_THREADS != '0'
        run: |
          app=$(find benchmarks/artifacts/bin -name ColdMultiGet.dll | head -1)
          dotnet "$app" --mode run --db "$DB_PATH" --size-gb "$SIZE_GB" --cache-mb "$CACHE_MB" \
            --rounds "$ROUNDS" --batches "$BATCHES" --threads "$THREADS" --hot-share "$HOT_SHARE" --read-io-threads "$READ_IO_THREADS" \
            --label control-io$READ_IO_THREADS-${{ matrix.arch }} --out "$RESULTS/control-io$READ_IO_THREADS-${{ matrix.arch }}.json" | tee "$RESULTS/control-io$READ_IO_THREADS-${{ matrix.arch }}.log"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cold-multiget-${{ matrix.arch }}
          path: results
          if-no-files-found: error

  pack:
    name: Pack candidate for a local feed
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Resolve candidate run
        env:
          IN_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          value="$IN_CANDIDATE_RUN_ID"
          if [ -z "$value" ]; then value=$(jq -r '.candidate_run_id // ""' benchmarks/ColdMultiGet/ci-params.json); fi
          echo "CANDIDATE_RUN_ID=$value" >> "$GITHUB_ENV"
          echo "candidate_run_id=$value"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Replace the Linux libraries with the candidate build
        if: env.CANDIDATE_RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for arch in x64 arm64; do
            gh run download "$CANDIDATE_RUN_ID" -R "$GITHUB_REPOSITORY" -n "linux-$arch" --dir "$RUNNER_TEMP/linux-$arch"
            cp "$RUNNER_TEMP/linux-$arch/librocksdb.so" src/Nethermind.RocksDbBindings/runtimes/linux-$arch/native/librocksdb.so
          done
          sha256sum src/Nethermind.RocksDbBindings/runtimes/linux-*/native/librocksdb.so

      - name: Pack
        if: env.CANDIDATE_RUN_ID != ''
        working-directory: src
        run: |
          version_prefix=$(sed -n 's|.*<VersionPrefix>\(.*\)</VersionPrefix>.*|\1|p' Directory.Build.props)
          dotnet pack ./Nethermind.RocksDbBindings -c release -p:Version=$version_prefix.${{ github.run_number }}-iouring
          ls -la artifacts/package/release

      - name: Upload package
        if: env.CANDIDATE_RUN_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: nupkg-iouring
          path: src/artifacts/package/release/*.nupkg
          if-no-files-found: error

name: Benchmark exact key presence
on:
  push:
    branches: [perf/has-key-no-pin]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          path: candidate
      - uses: actions/checkout@v7
        with:
          repository: NethermindEth/rocksdb-bindings
          ref: 165c9d253eaa19aa5aead2abef6ec4d276359a39
          lfs: true
          path: baseline
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: candidate/global.json
      - name: Record sources and machine
        shell: bash
        run: |
          mkdir results
          git -C baseline rev-parse HEAD > results/baseline-sha.txt
          git -C candidate rev-parse HEAD > results/candidate-sha.txt
          dotnet --info > results/dotnet.txt
          lscpu > results/cpu.txt
          sha256sum baseline/src/Nethermind.RocksDbBindings/runtimes/linux-*/native/librocksdb.so candidate/src/Nethermind.RocksDbBindings/runtimes/linux-*/native/librocksdb.so > results/native-sha256.txt
      - name: Test
        working-directory: candidate/src/Nethermind.RocksDbBindings.Tests
        env:
          ROCKSDB_EXPECT_NATIVE_ASYNC: '1'
        run: dotnet test -c Release
      - name: Build unchanged baseline
        working-directory: baseline
        run: dotnet build src/Nethermind.RocksDbBindings -c Release -p:AssemblyName=Nethermind.RocksDbBindings.Baseline
      - name: Measure
        working-directory: candidate
        shell: bash
        env:
          BENCH_DATA: ${{ runner.temp }}/has-key-data
        run: |
          set -euo pipefail
          mkdir -p "$BENCH_DATA"
          export HASKEY_BASELINE_DLL="$GITHUB_WORKSPACE/baseline/src/artifacts/bin/Nethermind.RocksDbBindings/release/Nethermind.RocksDbBindings.Baseline.dll"
          test -f "$HASKEY_BASELINE_DLL"
          dotnet run --project benchmarks/HasKey -c Release -- --filter '*' --exporters json markdown --artifacts "$GITHUB_WORKSPACE/results/bdn" --join
          python3 benchmarks/HasKey/verify.py "$GITHUB_WORKSPACE/results/bdn"
      - name: Job summary
        if: always()
        shell: bash
        run: |
          find results -name '*github.md' -exec cat {} \; >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: has-key-${{ matrix.os }}
          path: results

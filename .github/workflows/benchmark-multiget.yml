name: Benchmark batched reads
on:
  push:
    branches: [perf/multiget-bench-proof]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          path: candidate
      - uses: actions/checkout@v7
        with:
          ref: 165c9d253eaa19aa5aead2abef6ec4d276359a39
          lfs: true
          path: baseline
      - uses: actions/checkout@v7
        with:
          ref: d6040cf00b66c0e45ab6c82b8a34501dcac500af
          path: reference
      - uses: actions/checkout@v7
        with:
          ref: 38ccf63d77ffad6bb15c3e8a882073ac0477992e
          path: production
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: candidate/global.json
      - name: Record and verify sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir results
          git -C baseline rev-parse HEAD > results/baseline-sha.txt
          git -C reference rev-parse HEAD > results/reference-sha.txt
          git -C candidate rev-parse HEAD > results/candidate-sha.txt
          git -C production rev-parse HEAD > results/production-sha.txt
          dotnet --info > results/dotnet.txt
          lscpu > results/cpu.txt
          python3 candidate/benchmarks/MultiGet/verify.py sources candidate baseline reference production
          sha256sum candidate/src/Nethermind.RocksDbBindings/runtimes/linux-*/native/librocksdb.so > results/native-sha256.txt
      - name: Test
        working-directory: candidate/src/Nethermind.RocksDbBindings.Tests
        env:
          ROCKSDB_EXPECT_NATIVE_ASYNC: '1'
        run: dotnet test -c Release
      - name: Measure
        working-directory: candidate
        shell: bash
        env:
          BENCH_DATA: ${{ runner.temp }}/multiget-data
        run: |
          set -euo pipefail
          mkdir -p "$BENCH_DATA"
          dotnet run --project benchmarks/MultiGet -c Release -- --filter '*' --exporters json markdown --artifacts "$GITHUB_WORKSPACE/results/bdn" --join
          python3 benchmarks/MultiGet/verify.py "$GITHUB_WORKSPACE/results/bdn"
      - name: Paired same-database measurements
        working-directory: candidate
        shell: bash
        env:
          BENCH_DATA: ${{ runner.temp }}/multiget-data
          DOTNET_TieredCompilation: '0'
        run: |
          set -euo pipefail
          cpu=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          for process in 1 2 3; do
            taskset -c "$cpu" dotnet run --no-build --project benchmarks/MultiGet -c Release -- --paired "$GITHUB_WORKSPACE/results/paired-$process.json" "$process"
          done
          python3 benchmarks/MultiGet/verify-paired.py "$GITHUB_WORKSPACE/results" --require-no-regression
      - name: Job summary
        if: always()
        shell: bash
        run: |
          find results -name '*github.md' -exec cat {} \; >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: multiget-${{ matrix.os }}
          path: results

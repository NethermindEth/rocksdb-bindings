name: Native MultiGet benchmark

on:
  push:
    branches: [perf/native-multiget-context]
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  RETENTION: 7
  VCPKG_REF: "2026.07.29"
  ROCKSDB_REF: abeebd9630f11bd08c28b7bd43c7bdfc62050654

jobs:
  benchmark:
    name: Native benchmark
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-latest' }}
    container:
      image: ubuntu:22.04
      options: --platform ${{ matrix.arch == 'arm64' && 'linux/arm64' || 'linux/amd64' }}
    env:
      TRIPLET: ${{ matrix.arch == 'arm64' && 'arm64-linux' || 'x64-linux' }}
      # Minimum CPU architecture. x86-64-v2 omits AVX2 and PCLMUL, which some
      # CPUs and VM models lack; 1 keeps its armv8-a+crc+crypto baseline.
      MIN_CPU: ${{ matrix.arch == 'arm64' && '1' || 'x86-64-v2' }}
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf autoconf-archive automake build-essential ca-certificates \
            cmake curl git git-lfs libtool pkg-config python3 libicu70 tar unzip zip

      - name: Check out RocksDB repository
        uses: actions/checkout@v7
        with:
          repository: facebook/rocksdb
          ref: ${{ env.ROCKSDB_REF }}

      - name: Check out bindings extension
        uses: actions/checkout@v7
        with:
          lfs: true
          path: bindings

      - name: Apply bindings extension
        run: cmake -P bindings/native/apply.cmake

      - name: Check out vcpkg repository
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_REF }}
          path: vcpkg

      - name: Cache dependencies
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ env.TRIPLET }}-${{ env.VCPKG_REF }}-${{ github.run_id }}
          restore-keys: vcpkg-${{ env.TRIPLET }}-${{ env.VCPKG_REF }}-

      - name: Build static dependencies
        run: |
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          # Keep libc malloc/free, jemalloc C++ operators, and dlopen-safe TLS.
          portfile=vcpkg/ports/jemalloc/portfile.cmake
          grep -Fxq '    OPTIONS ${opts}' $portfile
          awk '{ print }
               $0 == "    OPTIONS ${opts}" {
                 print "        --enable-cxx"
                 print "        --disable-initial-exec-tls"
                 print "        --with-jemalloc-prefix=je_"
               }' $portfile > $portfile.patched
          mv -f $portfile.patched $portfile
          # Dependency sources embed __FILE__ too, so remap their paths as well.
          prefix_map="-ffile-prefix-map=$GITHUB_WORKSPACE=."
          triplet=$(find vcpkg/triplets -name "$TRIPLET.cmake")
          echo "string(APPEND VCPKG_C_FLAGS \" $prefix_map\")" >> $triplet
          echo "string(APPEND VCPKG_CXX_FLAGS \" $prefix_map\")" >> $triplet
          # Match RocksDB's F14 intrinsics and avoid static C++ runtime interposition.
          # These flags replace the triplet's, so they repeat -fPIC and the path map.
          folly_cpu=x86-64-v2
          if [ "$TRIPLET" = arm64-linux ]; then folly_cpu=armv8-a+crc+crypto; fi
          sed -i "/-DCMAKE_INSTALL_DIR=share\/folly/a\\        -DFOLLY_NO_EXCEPTION_TRACER=ON\n        \"-DCMAKE_CXX_FLAGS=-fPIC -march=$folly_cpu $prefix_map\"" \
            vcpkg/ports/folly/portfile.cmake
          # Fix feature detection and use the definitions supplied by liburing 2.15.
          cp bindings/native/folly-liburing.patch vcpkg/ports/folly/
          sed -i '/        fix-fmt-header.patch/a\        folly-liburing.patch' \
            vcpkg/ports/folly/portfile.cmake
          ./vcpkg/vcpkg install --clean-after-build \
            jemalloc:$TRIPLET lz4:$TRIPLET "snappy[rtti]:$TRIPLET" zstd:$TRIPLET \
            "folly[liburing]:$TRIPLET"
          grep -qx '#define FOLLY_HAS_LIBURING 1' \
            vcpkg/installed/$TRIPLET/include/folly/folly-config.h
          shared=$(find vcpkg/installed/$TRIPLET/lib -maxdepth 1 -name '*.so' -o -name '*.so.*')
          if [ -n "$shared" ]; then
            echo "::error::vcpkg produced shared dependencies: $shared"
            exit 1
          fi

      - name: Save dependencies
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ env.TRIPLET }}-${{ env.VCPKG_REF }}-${{ github.run_id }}

      - name: Build
        run: |
          deps=$GITHUB_WORKSPACE/vcpkg/installed/$TRIPLET
          # Keep bundled dependencies private and C++ allocations on jemalloc.
          echo '{ global: rocksdb_*; local: *; };' > $GITHUB_WORKSPACE/exports.map
          # RocksDB's logging macros embed __FILE__, so remap the paths.
          cmake -S bindings/native -B build \
            -DROCKSDB_SOURCE=$GITHUB_WORKSPACE \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS=-ffile-prefix-map=$GITHUB_WORKSPACE=. \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,--whole-archive,$deps/lib/libjemalloc.a,--no-whole-archive -Wl,--version-script=$GITHUB_WORKSPACE/exports.map -static-libstdc++ -flto=$CMAKE_BUILD_PARALLEL_LEVEL" \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=$TRIPLET \
            -DFAIL_ON_WARNINGS=OFF \
            -DHAVE_MALLOC_USABLE_SIZE=OFF \
            -DPORTABLE=$MIN_CPU \
            -DUSE_COROUTINES=ON \
            -DUSE_RTTI=ON \
            -DWITH_BENCHMARK_TOOLS=OFF \
            -DWITH_BZ2=OFF \
            -DWITH_CORE_TOOLS=OFF \
            -DWITH_EXAMPLES=OFF \
            -DWITH_GFLAGS=OFF \
            -DWITH_JEMALLOC=ON \
            -DWITH_LIBURING=ON \
            -DWITH_LZ4=ON \
            -DWITH_SNAPPY=ON \
            -DWITH_TESTS=OFF \
            -DWITH_TOOLS=OFF \
            -DWITH_TRACE_TOOLS=OFF \
            -DWITH_ZLIB=OFF \
            -DWITH_ZSTD=ON
          cmake --build build --target rocksdb-shared
          mkdir artifact
          cp -L build/librocksdb.so artifact/librocksdb.so
          strip artifact/librocksdb.so

      - name: Verify
        run: |
          library=artifact/librocksdb.so
          readelf -d $library | grep NEEDED
          unexpected=$(readelf -d $library |
            sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' |
            grep -Ev '^(ld-linux-(x86-64|aarch64)|libc|libdl|libgcc_s|libm|libpthread|librt)\.so' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Third-party dependencies must be statically linked: $unexpected"
            exit 1
          fi
          if ldd -r $library 2>&1 | grep -E 'not found|undefined symbol'; then
            echo "::error::The library has unresolved runtime dependencies"
            exit 1
          fi
          if strings $library | grep -F "$GITHUB_WORKSPACE"; then
            echo "::error::The library embeds build paths"
            exit 1
          fi
          # Private jemalloc symbols are available only before stripping.
          jemalloc=$GITHUB_WORKSPACE/vcpkg/installed/$TRIPLET/lib/libjemalloc.a
          archive_defined=$(nm -A --defined-only "$jemalloc" |
            awk '$2 ~ /^[TW]$/ { print $3 }' | sort -u)
          defined=$(readelf -Ws build/librocksdb.so |
            awk '$7 != "UND" { sub(/@@.*/, "", $8); print $8 }' | sort -u)
          for symbol in _Znwm _Znam _ZdlPv _ZdaPv; do
            if ! echo "$archive_defined" | grep -qx "$symbol" ||
               ! echo "$defined" | grep -qx "$symbol"; then
              echo "::error::jemalloc C++ operator is missing: $symbol"
              exit 1
            fi
          done
          if ! echo "$defined" | grep -qx je_mallocx; then
            echo "::error::jemalloc is not linked into RocksDB"
            exit 1
          fi
          if echo "$defined" | grep -qxE 'malloc|free'; then
            echo "::error::jemalloc must not replace malloc"
            exit 1
          fi
          if readelf -Ws build/librocksdb.so |
             awk '$7 == "UND" { sub(/@.*/, "", $8); print $8 }' |
             grep -qx malloc_usable_size; then
            echo "::error::RocksDB must not query libc for jemalloc allocation sizes"
            exit 1
          fi
          leaked=$(readelf --dyn-syms -W $library |
            awk '$1 ~ /^[0-9]+:$/ && $5 != "LOCAL" && $7 != "UND" { sub(/@@.*/, "", $8); print $8 }' |
            grep -Ev '^(rocksdb_|_init$|_fini$|_edata$|_end$|__bss_start$|$)' | sort -u || true)
          if [ -n "$leaked" ]; then
            echo "::error::Only the rocksdb_* C API may be exported: $(echo $leaked | cut -c1-400)"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: artifact/librocksdb.so
          retention-days: ${{ env.RETENTION }}
          if-no-files-found: error

      - name: Check out measured reference
        uses: actions/checkout@v7
        with:
          ref: f189a514f67d83066126ba57f97fa73b520eff9c
          path: reference

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: bindings/global.json

      - name: Record and verify sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          git rev-parse HEAD > results/rocksdb-sha.txt
          git -C bindings rev-parse HEAD > results/candidate-sha.txt
          git -C reference rev-parse HEAD > results/reference-sha.txt
          lscpu > results/cpu.txt
          dotnet --info > results/dotnet.txt
          cp bindings/.github/workflows/benchmark-native-multiget.yml results/build-workflow.yml
          sha256sum artifact/librocksdb.so > results/native-sha256.txt
          python3 bindings/benchmarks/NativeMultiGet/verify.py sources bindings reference .
          cp artifact/librocksdb.so bindings/src/Nethermind.RocksDbBindings/runtimes/linux-${{ matrix.arch }}/native/librocksdb.so

      - name: Test both APIs and native result lifetime
        working-directory: bindings/src/Nethermind.RocksDbBindings.Tests
        env:
          ROCKSDB_EXPECT_NATIVE_ASYNC: '1'
        run: dotnet test -c Release

      - name: Benchmark
        working-directory: bindings
        shell: bash
        env:
          BENCH_DATA: ${{ runner.temp }}/native-multiget-data
        run: |
          set -euo pipefail
          mkdir -p "$BENCH_DATA"
          dotnet run --project benchmarks/NativeMultiGet -c Release -- --filter '*' --exporters json markdown --artifacts "$GITHUB_WORKSPACE/results/bdn" --join
          python3 benchmarks/NativeMultiGet/verify.py "$GITHUB_WORKSPACE/results/bdn"

      - name: Paired timings and native allocations
        working-directory: bindings
        shell: bash
        env:
          BENCH_DATA: ${{ runner.temp }}/native-multiget-data
          DOTNET_TieredCompilation: '0'
        run: |
          set -euo pipefail
          cpu=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          for process in 1 2 3; do
            taskset -c "$cpu" dotnet run --no-build --project benchmarks/NativeMultiGet -c Release -- --paired "$GITHUB_WORKSPACE/results/paired-$process.json" "$process"
          done
          python3 benchmarks/NativeMultiGet/verify-paired.py "$GITHUB_WORKSPACE/results"

      - name: Summary
        if: always()
        shell: bash
        run: |
          if [ -d results ]; then
            find results -name '*github.md' -exec cat {} \; >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-multiget-${{ matrix.arch }}
          path: results
          if-no-files-found: warn

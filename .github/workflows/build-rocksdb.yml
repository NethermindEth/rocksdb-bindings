name: Build RocksDB

on:
  workflow_dispatch:
    inputs:
      ref:
        description: RocksDB repo ref
        required: true
        default: main
        type: string
      jemalloc:
        description: >-
          Linux only. 'complete' (default) bundles jemalloc as the allocator for every allocation in
          the library, C and C++ alike, routing the libc calls whose result RocksDB frees itself
          (strdup, getline, and getcwd/realpath with a NULL buffer) onto it; 'private' keeps jemalloc
          prefixed and serving only C++ new/delete, leaving C malloc on libc; 'none' bundles no
          allocator at all.
        required: false
        default: complete
        type: choice
        options:
          - complete
          - private
          - none
      create-pr:
        description: Create a pull request
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  RETENTION: 7
  # Supplies static jemalloc and compression libraries.
  VCPKG_REF: "2026.07.29"

jobs:
  build-linux:
    name: Linux build
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-latest' }}
    container:
      image: ubuntu:22.04
      options: --platform ${{ matrix.arch == 'arm64' && 'linux/arm64' || 'linux/amd64' }}
    env:
      TRIPLET: ${{ matrix.arch == 'arm64' && 'arm64-linux' || 'x64-linux' }}
      # Minimum CPU architecture. x86-64-v3 omits the PCLMUL that RocksDB's
      # CRC32C path infers from AVX; 1 keeps its armv8-a+crc+crypto baseline.
      MIN_CPU: ${{ matrix.arch == 'arm64' && '1' || 'haswell' }}
      JEMALLOC: ${{ inputs.jemalloc }}
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf autoconf-archive automake build-essential ca-certificates \
            cmake curl git libtool pkg-config tar unzip zip

      - name: Check out RocksDB repository
        uses: actions/checkout@v7
        with:
          repository: facebook/rocksdb
          ref: ${{ inputs.ref }}

      - name: Check out vcpkg repository
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_REF }}
          path: vcpkg

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: bindings

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ env.TRIPLET }}-${{ env.VCPKG_REF }}-${{ github.run_id }}
          restore-keys: vcpkg-${{ env.TRIPLET }}-${{ env.VCPKG_REF }}-

      - name: Build static dependencies
        run: |
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          ports="lz4:$TRIPLET snappy:$TRIPLET zstd:$TRIPLET"
          if [ "$JEMALLOC" != none ]; then
            # jemalloc supplies the C++ operators, and dlopen'd libraries cannot use initial-exec TLS.
            # 'private' prefixes the C API so libc keeps malloc; 'complete' leaves it unprefixed so
            # every allocation in the library binds to jemalloc (the version script exports none of it).
            prefix=
            if [ "$JEMALLOC" = private ]; then
              prefix="        --with-jemalloc-prefix=je_"
            fi
            portfile=vcpkg/ports/jemalloc/portfile.cmake
            grep -Fxq '    OPTIONS ${opts}' $portfile
            awk -v prefix="$prefix" '{ print }
                 $0 == "    OPTIONS ${opts}" {
                   print "        --enable-cxx"
                   print "        --disable-initial-exec-tls"
                   if (prefix != "") print prefix
                 }' $portfile > $portfile.patched
            mv -f $portfile.patched $portfile
            ports="jemalloc:$TRIPLET $ports"
          fi
          ./vcpkg/vcpkg install --clean-after-build $ports
          shared=$(find vcpkg/installed/$TRIPLET/lib -maxdepth 1 -name '*.so' -o -name '*.so.*')
          if [ -n "$shared" ]; then
            echo "::error::vcpkg produced shared dependencies: $shared"
            exit 1
          fi

      - name: Build
        run: |
          deps=$GITHUB_WORKSPACE/vcpkg/installed/$TRIPLET
          # Keep bundled dependencies private and C++ allocations on jemalloc.
          echo '{ global: rocksdb_*; local: *; };' > $GITHUB_WORKSPACE/exports.map
          # Without a bundled allocator, operator new and malloc both fall through to whichever
          # allocator the process supplies, keeping the C API boundary on a single heap.
          allocator=
          with_jemalloc=OFF
          if [ "$JEMALLOC" != none ]; then
            allocator="-Wl,--whole-archive,$deps/lib/libjemalloc.a,--no-whole-archive"
            with_jemalloc=ON
          fi
          # glibc hands RocksDB heap pointers from these calls and RocksDB releases them with free(),
          # so they are redirected to shims that allocate from the bundled allocator instead.
          # -fno-builtin keeps the compiler from rewriting a shim body into a call to the very libc
          # routine it replaces.
          if [ "$JEMALLOC" = complete ]; then
            gcc -c -O2 -fno-builtin -fPIC -o $GITHUB_WORKSPACE/alloc_shims.o bindings/native/alloc_shims.c
            allocator="$allocator $GITHUB_WORKSPACE/alloc_shims.o"
            allocator="$allocator -Wl,--wrap=strdup,--wrap=getcwd,--wrap=realpath,--wrap=__getdelim,--wrap=getdelim,--wrap=getline"
          fi
          # RocksDB's logging macros embed __FILE__, so remap the paths.
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS=-ffile-prefix-map=$GITHUB_WORKSPACE=. \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_SHARED_LINKER_FLAGS="$allocator -Wl,--version-script=$GITHUB_WORKSPACE/exports.map -static-libstdc++ -flto=$CMAKE_BUILD_PARALLEL_LEVEL" \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=$TRIPLET \
            -DFAIL_ON_WARNINGS=OFF \
            -DHAVE_MALLOC_USABLE_SIZE=OFF \
            -DPORTABLE=$MIN_CPU \
            -DROCKSDB_BUILD_SHARED=ON \
            -DUSE_RTTI=OFF \
            -DWITH_BENCHMARK_TOOLS=OFF \
            -DWITH_BZ2=OFF \
            -DWITH_CORE_TOOLS=OFF \
            -DWITH_EXAMPLES=OFF \
            -DWITH_GFLAGS=OFF \
            -DWITH_JEMALLOC=$with_jemalloc \
            -DWITH_LIBURING=OFF \
            -DWITH_LZ4=ON \
            -DWITH_SNAPPY=ON \
            -DWITH_TESTS=OFF \
            -DWITH_TOOLS=OFF \
            -DWITH_TRACE_TOOLS=OFF \
            -DWITH_ZLIB=OFF \
            -DWITH_ZSTD=ON
          cmake --build build --target rocksdb-shared
          mkdir artifact
          cp -L build/librocksdb.so artifact/librocksdb.so
          strip artifact/librocksdb.so

      - name: Verify
        run: |
          library=artifact/librocksdb.so
          readelf -d $library | grep NEEDED
          unexpected=$(readelf -d $library |
            sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' |
            grep -Ev '^(ld-linux-(x86-64|aarch64)|libc|libdl|libgcc_s|libm|libpthread|librt)\.so' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Third-party dependencies must be statically linked: $unexpected"
            exit 1
          fi
          if ldd -r $library 2>&1 | grep -E 'not found|undefined symbol'; then
            echo "::error::The library has unresolved runtime dependencies"
            exit 1
          fi
          # Symbols hidden by the version script are visible only before stripping.
          defined=$(readelf -Ws build/librocksdb.so |
            awk '$7 != "UND" { sub(/@@.*/, "", $8); print $8 }' | sort -u)
          imported=$(readelf -Ws build/librocksdb.so |
            awk '$7 == "UND" { sub(/@.*/, "", $8); print $8 }' | sort -u)
          if [ "$JEMALLOC" != none ]; then
            alloc_symbol=je_mallocx
            if [ "$JEMALLOC" = complete ]; then
              alloc_symbol=mallocx
            fi
            jemalloc=$GITHUB_WORKSPACE/vcpkg/installed/$TRIPLET/lib/libjemalloc.a
            archive_defined=$(nm -A --defined-only "$jemalloc" |
              awk '$2 ~ /^[TW]$/ { print $3 }' | sort -u)
            for symbol in _Znwm _Znam _ZdlPv _ZdaPv; do
              if ! echo "$archive_defined" | grep -qx "$symbol" ||
                 ! echo "$defined" | grep -qx "$symbol"; then
                echo "::error::jemalloc C++ operator is missing: $symbol"
                exit 1
              fi
            done
            if ! echo "$defined" | grep -qx "$alloc_symbol"; then
              echo "::error::jemalloc is not linked into RocksDB: $alloc_symbol is missing"
              exit 1
            fi
          else
            if echo "$defined" | grep -qxE 'je_mallocx|mallocx'; then
              echo "::error::jemalloc must not be bundled"
              exit 1
            fi
            # Every allocation has to reach the process allocator for one heap to serve them all.
            for symbol in malloc free; do
              if ! echo "$imported" | grep -qx "$symbol"; then
                echo "::error::RocksDB must import $symbol from the process allocator"
                exit 1
              fi
            done
          fi
          if [ "$JEMALLOC" = complete ]; then
            # The version script keeps malloc unexported, which the export check below enforces.
            for symbol in malloc free; do
              if ! echo "$defined" | grep -qx "$symbol"; then
                echo "::error::the complete build must define $symbol"
                exit 1
              fi
            done
            # ld redirects every reference on the link line, so the wrap is total by construction;
            # what has to be checked is that the shims linked at all. getcwd and realpath stay
            # imported because __real_getcwd/__real_realpath are those imports.
            for symbol in __wrap_strdup __wrap_getcwd __wrap_realpath __wrap___getdelim; do
              if ! echo "$defined" | grep -qx "$symbol"; then
                echo "::error::$symbol was not linked in; the allocator wrap is inactive"
                exit 1
              fi
            done
            # None of the glibc entry points that hand the caller heap memory to free may be
            # imported: RocksDB would release that memory through the bundled allocator. The wrapped
            # ones must be gone, and a RocksDB upgrade must not start calling any of the others.
            for symbol in strdup __getdelim getdelim getline strndup wcsdup asprintf vasprintf \
              __asprintf get_current_dir_name canonicalize_file_name backtrace_symbols scandir \
              scandirat open_memstream open_wmemstream tempnam; do
              if echo "$imported" | grep -qx "$symbol"; then
                echo "::error::$symbol is imported from glibc; its result would be freed by the bundled allocator"
                exit 1
              fi
            done
          elif echo "$defined" | grep -qxE 'malloc|free'; then
            echo "::error::the bundled allocator must not replace malloc"
            exit 1
          fi
          if echo "$imported" | grep -qx malloc_usable_size; then
            echo "::error::RocksDB must not query libc for jemalloc allocation sizes"
            exit 1
          fi
          leaked=$(readelf --dyn-syms -W $library |
            awk '$1 ~ /^[0-9]+:$/ && $5 != "LOCAL" && $7 != "UND" { sub(/@@.*/, "", $8); print $8 }' |
            grep -Ev '^(rocksdb_|_init$|_fini$|_edata$|_end$|__bss_start$|$)' | sort -u || true)
          if [ -n "$leaked" ]; then
            echo "::error::Only the rocksdb_* C API may be exported: $(echo $leaked | cut -c1-400)"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: artifact/librocksdb.so
          retention-days: ${{ env.RETENTION }}
          if-no-files-found: error

  build-macos:
    name: macOS build
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-latest' || 'macos-26-intel' }}
    env:
      TRIPLET: ${{ matrix.arch == 'arm64' && 'arm64-osx' || 'x64-osx' }}
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      # See the Linux job.
      MIN_CPU: ${{ matrix.arch == 'arm64' && '1' || 'haswell' }}
    steps:
      - name: Check out RocksDB repository
        uses: actions/checkout@v7
        with:
          repository: facebook/rocksdb
          ref: ${{ inputs.ref }}

      - name: Check out vcpkg repository
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_REF }}
          path: vcpkg

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ env.TRIPLET }}-${{ env.VCPKG_REF }}-${{ github.run_id }}
          restore-keys: vcpkg-${{ env.TRIPLET }}-${{ env.VCPKG_REF }}-

      - name: Build static dependencies
        run: |
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          ./vcpkg/vcpkg install --clean-after-build \
            lz4:$TRIPLET snappy:$TRIPLET zstd:$TRIPLET
          shared=$(find vcpkg/installed/$TRIPLET/lib -maxdepth 1 -name '*.dylib')
          if [ -n "$shared" ]; then
            echo "::error::vcpkg produced shared dependencies: $shared"
            exit 1
          fi

      - name: Build
        run: |
          # Mach-O symbols carry a leading underscore.
          echo '_rocksdb_*' > $GITHUB_WORKSPACE/exports.txt
          # RocksDB's logging macros embed __FILE__, so remap the paths.
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS=-ffile-prefix-map=$GITHUB_WORKSPACE=. \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-exported_symbols_list,$GITHUB_WORKSPACE/exports.txt" \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=$TRIPLET \
            -DFAIL_ON_WARNINGS=OFF \
            -DPORTABLE=$MIN_CPU \
            -DROCKSDB_BUILD_SHARED=ON \
            -DUSE_RTTI=OFF \
            -DWITH_BENCHMARK_TOOLS=OFF \
            -DWITH_BZ2=OFF \
            -DWITH_CORE_TOOLS=OFF \
            -DWITH_EXAMPLES=OFF \
            -DWITH_GFLAGS=OFF \
            -DWITH_JEMALLOC=OFF \
            -DWITH_LIBURING=OFF \
            -DWITH_LZ4=ON \
            -DWITH_SNAPPY=ON \
            -DWITH_TESTS=OFF \
            -DWITH_TOOLS=OFF \
            -DWITH_TRACE_TOOLS=OFF \
            -DWITH_ZLIB=OFF \
            -DWITH_ZSTD=ON
          cmake --build build --target rocksdb-shared
          mkdir artifact
          cp -L build/librocksdb.dylib artifact/librocksdb.dylib
          strip -x artifact/librocksdb.dylib

      - name: Verify
        run: |
          library=artifact/librocksdb.dylib
          otool -L $library
          unexpected=$(otool -L $library | tail -n +2 | awk '{ print $1 }' |
            grep -Ev '^(@rpath/librocksdb|/usr/lib/|/System/Library/)' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Third-party dependencies must be statically linked: $unexpected"
            exit 1
          fi
          leaked=$(nm -gU $library | awk 'NF >= 3 { sub(/^_/, "", $3); print $3 }' |
            grep -Ev '^(rocksdb_|$)' | sort -u || true)
          if [ -n "$leaked" ]; then
            echo "::error::Only the rocksdb_* C API may be exported: $(echo $leaked | cut -c1-400)"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: osx-${{ matrix.arch }}
          path: artifact/librocksdb.dylib
          retention-days: ${{ env.RETENTION }}
          if-no-files-found: error

  build-windows:
    name: Windows build
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2022' }}
    env:
      # Static libraries against the dynamic CRT, matching RocksDB's /MD default.
      TRIPLET: ${{ matrix.arch == 'arm64' && 'arm64-windows-static-md' || 'x64-windows-static-md' }}
    steps:
      - name: Check out RocksDB repository
        uses: actions/checkout@v7
        with:
          repository: facebook/rocksdb
          ref: ${{ inputs.ref }}

      - name: Check out vcpkg repository
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_REF }}
          path: vcpkg

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ env.TRIPLET }}-${{ env.VCPKG_REF }}-${{ github.run_id }}
          restore-keys: vcpkg-${{ env.TRIPLET }}-${{ env.VCPKG_REF }}-

      - name: Build static dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          ./vcpkg/vcpkg.exe install --clean-after-build `
            lz4:$env:TRIPLET snappy:$env:TRIPLET zstd:$env:TRIPLET
          $shared = Get-ChildItem "vcpkg/installed/$env:TRIPLET/bin" -Filter *.dll `
            -File -ErrorAction Ignore
          if ($shared) {
            throw "vcpkg produced shared dependencies: $($shared.Name -join ', ')"
          }

      - name: Build
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # MSBuild imports this and routes cl.exe through a ccache wrapper.
          Remove-Item Directory.Build.props -ErrorAction Ignore
          $deps = Join-Path $PWD "vcpkg/installed/$env:TRIPLET"

          function Resolve-Library([string[]] $names) {
            foreach ($name in $names) {
              $path = Join-Path $deps "lib/$name"
              if (Test-Path $path) { return $path }
            }
            $available = (Get-ChildItem "$deps/lib" -File -Filter *.lib).Name -join ', '
            throw "None of $($names -join ', ') found in $deps/lib. Available: $available"
          }

          # RocksDB locates third-party libraries through thirdparty.inc on MSVC.
          $env:SNAPPY_INCLUDE = "$deps/include"
          $env:SNAPPY_LIB_RELEASE = Resolve-Library @("snappy.lib")
          $env:LZ4_INCLUDE = "$deps/include"
          $env:LZ4_LIB_RELEASE = Resolve-Library @("lz4.lib")
          $env:ZSTD_INCLUDE = "$deps/include"
          $env:ZSTD_LIB_RELEASE = Resolve-Library @("zstd.lib", "zstd_static.lib", "libzstd_static.lib")

          # WIN_CI enables parallel compilation and drops debug info; /Brepro
          # replaces the linker timestamp with a content hash.
          cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.arch }} `
            "-DCMAKE_SHARED_LINKER_FLAGS=/Brepro" `
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON `
            -DFAIL_ON_WARNINGS=OFF `
            -DPORTABLE=${{ matrix.arch == 'arm64' && '1' || 'AVX2' }} `
            -DROCKSDB_BUILD_SHARED=ON `
            -DUSE_RTTI=OFF `
            -DWIN_CI=ON `
            -DWITH_BENCHMARK_TOOLS=OFF `
            -DWITH_BZ2=OFF `
            -DWITH_CORE_TOOLS=OFF `
            -DWITH_EXAMPLES=OFF `
            -DWITH_GFLAGS=OFF `
            -DWITH_JEMALLOC=OFF `
            -DWITH_LZ4=ON `
            -DWITH_MD_LIBRARY=ON `
            -DWITH_SNAPPY=ON `
            -DWITH_TESTS=OFF `
            -DWITH_TOOLS=OFF `
            -DWITH_TRACE_TOOLS=OFF `
            -DWITH_ZLIB=OFF `
            -DWITH_ZSTD=ON
          cmake --build build --config Release --target rocksdb-shared

          $library = Get-ChildItem build -Recurse -File -Filter rocksdb-shared.dll |
            Select-Object -First 1
          if (!$library) { throw "The RocksDB DLL was not produced" }
          New-Item -ItemType Directory artifact | Out-Null
          Copy-Item $library.FullName artifact/rocksdb.dll

      - name: Verify
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs/VC/Tools/MSVC/*/bin/Host*/*/dumpbin.exe" |
            Select-Object -First 1
          if (!$dumpbin) { throw "dumpbin was not found under $vs" }
          # dumpbin loads its linker libraries from its own directory.
          $env:PATH = "$($dumpbin.Directory);$env:PATH"
          $dependents = & $dumpbin /nologo /dependents artifact/rocksdb.dll
          Write-Output $dependents
          $bundled = $dependents |
            Select-String '^\s+(lib)?(lz4|snappy|zstd)\S*\.dll$'
          if ($bundled) {
            throw "Third-party dependencies must be statically linked: $($bundled.Line.Trim())"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: win-${{ matrix.arch }}
          path: artifact/rocksdb.dll
          retention-days: ${{ env.RETENTION }}
          if-no-files-found: error

  generate-bindings:
    name: Generate bindings
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate
        env:
          REF: ${{ inputs.ref }}
        run: bash generation/run.sh "$REF"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings
          path: src/Nethermind.RocksDbBindings/RocksDbNative.g.cs
          retention-days: ${{ env.RETENTION }}
          if-no-files-found: error

  create-pr:
    name: Create a pull request
    needs: [build-linux, build-macos, build-windows, generate-bindings]
    if: inputs.create-pr
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: "{linux,osx,win}-*"
          path: src/Nethermind.RocksDbBindings/runtimes

      - name: Download bindings
        uses: actions/download-artifact@v8
        with:
          name: bindings
          path: src/Nethermind.RocksDbBindings

      - name: Move artifacts
        working-directory: src/Nethermind.RocksDbBindings/runtimes
        run: |
          for rid in linux-arm64 linux-x64; do
            mkdir -p $rid/native && mv -f $rid/librocksdb.so $rid/native/
          done
          for rid in osx-arm64 osx-x64; do
            mkdir -p $rid/native && mv -f $rid/librocksdb.dylib $rid/native/
          done
          for rid in win-arm64 win-x64; do
            mkdir -p $rid/native && mv -f $rid/rocksdb.dll $rid/native/
          done

      - name: Update version
        env:
          REF: ${{ inputs.ref }}
        run: |
          version=${REF#v}
          if [[ $version =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            sed -i "s|<VersionPrefix>.*</VersionPrefix>|<VersionPrefix>$version</VersionPrefix>|" \
              src/Directory.Build.props
          fi

      - name: Create a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          head_branch=feature/rocksdb-build-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT
          title="chore(deps): update RocksDB binaries and bindings to ${REF#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b $head_branch
          git add -A
          git commit -m "$title"
          git push origin $head_branch
          gh pr create -B $GITHUB_REF_NAME -H $head_branch -t "$title" \
            -b "Built and generated from RocksDB $REF."

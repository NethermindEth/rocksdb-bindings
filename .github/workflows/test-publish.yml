name: Test / Publish

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to NuGet
        default: 'No'
        type: choice
        options:
          - 'No'
          - Staging
          - Production

jobs:
  test:
    name: Test
    strategy:
      matrix:
        os:
          - ubuntu-latest
          # - ubuntu-24.04-arm
          # - macos-latest
          # - macos-latest-large
          # - windows-latest
          # - windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Install dependencies
        working-directory: src
        run: dotnet restore

      # TODO: Replace with proper tests
      - name: Build
        working-directory: src/Nethermind.RocksDbBindings
        run: |
          dotnet build -c release

      # - name: Test
      #   working-directory: src/Nethermind.RocksDbBindings.Tests
      #   run: |
      #     dotnet test -c release --no-restore

  notices:
    name: Notices
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check declared dependencies are mentioned
        run: |
          # grep exits non-zero on no match, which would end the step early.
          ports=$(grep -oE '[a-z0-9.+-]+:\$(env:)?TRIPLET' \
            .github/workflows/build-rocksdb.yml | sed 's/:.*//' | sort -u || true)
          if [ -z "$ports" ]; then
            echo "::error::No vcpkg ports found in build-rocksdb.yml"
            exit 1
          fi
          missing=""
          for port in $ports; do
            grep -qiw -- "$port" THIRD-PARTY-NOTICES.txt || missing="$missing $port"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing from THIRD-PARTY-NOTICES.txt:$missing"
            exit 1
          fi
          echo "Attributed: $(echo $ports | tr '\n' ' ')"

  publish:
    name: Publish
    needs: [notices, test]
    if: github.event_name == 'workflow_dispatch' && inputs.publish != 'No' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NUGET_HOST: ${{ inputs.publish == 'Staging' && 'https://int.nugettest.org' || 'https://www.nuget.org' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Detect version
        id: version
        working-directory: src
        run: |
          version_prefix=$(sed -n 's|.*<VersionPrefix>\(.*\)</VersionPrefix>.*|\1|p' Directory.Build.props)
          version_suffix=$(sed -n 's|.*<VersionSuffix>\(.*\)</VersionSuffix>.*|\1|p' Directory.Build.props)
          version=$version_prefix${version_suffix:+-$version_suffix}
          echo "Detected version $version"
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: NuGet login
        uses: nuget/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
          audience: ${{ env.NUGET_HOST }}
          token-service-url: ${{ env.NUGET_HOST }}/api/v2/token

      - name: Publish
        working-directory: src
        run: |
          dotnet pack ./Nethermind.RocksDbBindings -c release \
            -p:Version=${{ steps.version.outputs.version }}.${{ github.run_number }}
          dotnet nuget push ./artifacts/package/release/*.nupkg \
            -k "${{ steps.login.outputs.NUGET_API_KEY }}" -s ${{ env.NUGET_HOST }}/api/v2/package

  #     - name: Test
  #       working-directory: src/Nethermind.RocksDbBindings.Tests
  #       run: |
  #         dotnet test -c release --no-restore

  publish:
    name: Publish
    # needs: test
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'No' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Detect version
        id: version
        working-directory: src
        run: |
          version_prefix=$(sed -n 's|.*<VersionPrefix>\(.*\)</VersionPrefix>.*|\1|p' Directory.Build.props)
          echo "Detected VersionPrefix $version_prefix"
          echo "version-prefix=$version_prefix" >> $GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Publish
        working-directory: src
        run: |
          dotnet pack ./Nethermind.RocksDbBindings -c release \
            -p:VersionPrefix=${{ steps.version.outputs.version-prefix }}.${{ github.run_number }}
          dotnet nuget push ./Nethermind.RocksDbBindings/artifacts/package/release/*.nupkg \
            -k ${{ github.event.inputs.publish == 'Staging' && secrets.NUGETTEST_API_KEY || secrets.NUGET_API_KEY }} \
            -s ${{ github.event.inputs.publish == 'Staging' && 'https://apiint.nugettest.org/v3/index.json' || 'https://api.nuget.org/v3/index.json' }}

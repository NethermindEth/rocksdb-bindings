name: Test / Publish

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to NuGet
        default: 'No'
        type: choice
        options:
          - 'No'
          - Staging
          - Production

jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-26.04-arm
          - macos-latest
          - macos-26-intel
          - windows-latest
          - windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Test
        working-directory: src/Nethermind.RocksDbBindings.Tests
        env:
          ROCKSDB_EXPECT_NATIVE_ASYNC: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: dotnet test -c release

  test-legacy-kernel:
    name: Test without io_uring or epoll_pwait2
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      # Kernels before 5.11 lack epoll_pwait2, and io_uring may be missing or filtered. The
      # profile returns ENOSYS for both, so async reads must run on the libevent fallback.
      - name: Test
        run: |
          docker run --rm \
            --security-opt seccomp="$PWD/.github/seccomp/no-io-uring-epoll-pwait2.json" \
            -e ROCKSDB_EXPECT_NATIVE_ASYNC=1 \
            -v "$PWD:/src" -w /src/src/Nethermind.RocksDbBindings.Tests \
            mcr.microsoft.com/dotnet/sdk:10.0 dotnet test -c release

  compatibility:
    name: Compatibility with the latest release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Only the native library decides what is on disk, so an unchanged one needs no check.
      - name: Compare the native library with the latest release
        id: baseline
        env:
          LIBRARY: src/Nethermind.RocksDbBindings/runtimes/linux-x64/native/librocksdb.so
        run: |
          set -o pipefail
          feed=https://api.nuget.org/v3-flatcontainer/nethermind.rocksdbbindings
          version=$(curl -fsSL $feed/index.json | jq -r '[.versions[] | select(contains("-") | not)] | last')
          curl -fsSL -o "$RUNNER_TEMP/baseline.nupkg" "$feed/$version/nethermind.rocksdbbindings.$version.nupkg"
          released=$(unzip -p "$RUNNER_TEMP/baseline.nupkg" "${LIBRARY#src/Nethermind.RocksDbBindings/}" | sha256sum | cut -d' ' -f1)
          current=$(git show "HEAD:$LIBRARY" | sed -n 's/^oid sha256://p')
          echo "version=$version" >> $GITHUB_OUTPUT
          if [ "$current" = "$released" ]; then
            echo "The linux-x64 native library matches $version; skipping."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git lfs pull --include="$LIBRARY"
          fi

      - name: Set up .NET
        if: steps.baseline.outputs.changed
        uses: actions/setup-dotnet@v6

      # Upgrades must always work. A downgrade break can be an accepted upstream change, such as a
      # new default format_version, so it only warns.
      - name: Check
        if: steps.baseline.outputs.changed
        working-directory: src
        env:
          BASELINE: ${{ steps.baseline.outputs.version }}
        run: |
          set -o pipefail
          baseline=$BASELINE
          current=$(sed -n 's|.*<VersionPrefix>\(.*\)</VersionPrefix>.*|\1|p' Directory.Build.props)
          echo "Baseline: $baseline, current: $current"
          project=Nethermind.RocksDbBindings.CompatibilityTests
          dotnet build $project -c release -o "$RUNNER_TEMP/current"
          dotnet build $project -c release -o "$RUNNER_TEMP/baseline" -p:BaselineVersion=$baseline
          check() { dotnet "$RUNNER_TEMP/$1/$project.dll" "${@:2}"; }
          # The baseline reads data that the current build wrote or compacted. $1 describes that data.
          downgrade() {
            label=$1; shift
            log="$RUNNER_TEMP/$(basename "$1").log"
            check baseline verify "$@" 2>&1 | tee "$log" && return
            echo "::warning title=Downgrade compatibility::$current data does not open correctly with $baseline; see the job summary"
            {
              echo "### Downgrade from $current to $baseline fails: $label"
              echo "Check that the upstream release notes expect this before publishing."
              echo '```'
              grep -E 'FAIL|Exception|checks failed' "$log" | head -50
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            return 1
          }
          data=$RUNNER_TEMP/data
          check current write $data/downgrade
          if downgrade "databases written by the current build" $data/downgrade --compact; then
            check current verify $data/downgrade
          fi
          check baseline write $data/upgrade
          check current verify $data/upgrade --compact
          downgrade "databases compacted by the current build" $data/upgrade || true

  notices:
    name: Notices
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check declared dependencies are mentioned
        run: |
          # grep exits non-zero on no match, which would end the step early.
          # Ports may carry a feature list, e.g. folly[liburing]:$TRIPLET.
          ports=$(grep -oE '[a-z0-9.+-]+(\[[a-z0-9,-]+\])?:\$(env:)?TRIPLET' \
            .github/workflows/build-rocksdb.yml | sed 's/[:[].*//' | sort -u || true)
          if [ -z "$ports" ]; then
            echo "::error::No vcpkg ports found in build-rocksdb.yml"
            exit 1
          fi
          missing=""
          for port in $ports; do
            grep -qiw -- "$port" THIRD-PARTY-NOTICES || missing="$missing $port"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing from THIRD-PARTY-NOTICES:$missing"
            exit 1
          fi
          echo "Attributed: $(echo $ports | tr '\n' ' ')"

  publish:
    name: Publish
    needs: [compatibility, notices, test, test-legacy-kernel]
    if: github.event_name == 'workflow_dispatch' && inputs.publish != 'No'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NUGET_URL: ${{ inputs.publish == 'Staging' && 'https://int.nugettest.org' || 'https://www.nuget.org' }}
      NUGET_SOURCE: ${{ inputs.publish == 'Staging' && 'https://apiint.nugettest.org' || 'https://api.nuget.org' }}/v3/index.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Detect version
        id: version
        working-directory: src
        run: |
          version_prefix=$(sed -n 's|.*<VersionPrefix>\(.*\)</VersionPrefix>.*|\1|p' Directory.Build.props)
          version_suffix=$(sed -n 's|.*<VersionSuffix>\(.*\)</VersionSuffix>.*|\1|p' Directory.Build.props)
          version=$version_prefix${version_suffix:+-$version_suffix}
          echo "Detected version $version"
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: NuGet login
        uses: nuget/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
          audience: ${{ env.NUGET_URL }}
          token-service-url: ${{ env.NUGET_URL }}/api/v2/token

      - name: Publish
        working-directory: src
        run: |
          dotnet pack ./Nethermind.RocksDbBindings -c release \
            -p:Version=${{ steps.version.outputs.version }}.${{ github.run_number }}
          dotnet nuget push ./artifacts/package/release/*.nupkg \
            -k "${{ steps.login.outputs.NUGET_API_KEY }}" -s ${{ env.NUGET_SOURCE }}
